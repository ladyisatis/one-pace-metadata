title: The Name of That Sea
originaltitle: ''
description: Garp tells Luffy that he's not going to arrest him or his crew, giving
  Luffy a moment to sit down and catch up with Koby and Helmeppo. As the old friends
  reminisce about how they met, however, something big is stirring in the New World.
  Not even the Marines' best can keep "Red-Haired" Shanks from meeting Whitebeard,
  arriving with his crew, some booze, and a very important request.
